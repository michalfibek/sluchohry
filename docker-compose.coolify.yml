services:
  sluchohry:
    image: 'php:7.0-apache'
    volumes:
      - 'sluchohry_www:/var/www/sluchohry'
    ports:
      - '80'
    depends_on:
      - sluchohry-db
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 128
    restart: unless-stopped
    command: >
      bash -c "
      sed -ri -e 's!/var/www/html!/var/www/sluchohry/www!g' /etc/apache2/sites-available/*.conf /etc/apache2/apache2.conf /etc/apache2/conf-available/*.conf &&
      sed -ri -e 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf &&
      a2enmod rewrite &&
      EXT_DIR=/usr/local/lib/php/extensions/no-debug-non-zts-20151012;
      if [ ! -f $EXT_DIR/pdo_mysql.so ] || [ ! -f $EXT_DIR/mysqli.so ] || [ ! -f $EXT_DIR/mbstring.so ] || [ ! -f $EXT_DIR/gd.so ]; then
        { echo 'deb http://archive.debian.org/debian stretch main'; echo 'deb http://archive.debian.org/debian-security stretch/updates main'; } > /etc/apt/sources.list &&
        echo 'Acquire::Check-Valid-Until \"false\";' > /etc/apt/apt.conf.d/99no-check-valid &&
        rm -rf /var/lib/apt/lists/* &&
        apt-get -o Acquire::AllowInsecureRepositories=true update &&
        apt-get install -y --no-install-recommends --allow-unauthenticated libpng-dev libjpeg62-turbo-dev libfreetype6-dev &&
        docker-php-ext-configure gd --with-freetype-dir=/usr --with-jpeg-dir=/usr &&
        docker-php-ext-install pdo_mysql mysqli mbstring gd &&
        rm -rf /var/lib/apt/lists/*;
      fi &&
      { echo 'memory_limit = 256M'; echo 'session.auto_start = 0'; echo 'upload_max_filesize = 20M'; echo 'post_max_size = 20M'; } > /usr/local/etc/php/conf.d/zz-sluchohry.ini &&
      apache2-foreground
      "
  sluchohry-db:
    image: 'mariadb:10.5'
    environment:
      MYSQL_DATABASE: sluchohry
      MYSQL_USER: sluchohry
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
    volumes:
      - 'sluchohry_db:/var/lib/mysql'
    cpus: 0.75
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 256
    restart: unless-stopped
volumes:
  sluchohry_www: null
  sluchohry_db: null
