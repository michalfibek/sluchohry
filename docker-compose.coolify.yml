services:
  sluchohry:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: sluchohry-db
      DB_NAME: sluchohry
      DB_USER: sluchohry
      DB_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'sluchohry_songs:/var/www/html/www/assets/sounds/songs'
      - 'sluchohry_sessions:/var/www/html/sessions'
      - 'sluchohry_log:/var/www/html/log'
    ports:
      - '80'
    depends_on:
      - sluchohry-db
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 128
    restart: unless-stopped
  sluchohry-db:
    image: 'mariadb:10.5'
    environment:
      MYSQL_DATABASE: sluchohry
      MYSQL_USER: sluchohry
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
    volumes:
      - 'sluchohry_db:/var/lib/mysql'
    cpus: 0.75
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 256
    restart: unless-stopped
volumes:
  sluchohry_songs: null
  sluchohry_sessions: null
  sluchohry_log: null
  sluchohry_db: null
