services:
  sluchohry:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: sluchohry-db
      DB_NAME: sluchohry
      DB_USER: sluchohry
      DB_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'sluchohry_songs:/var/www/html/www/assets/sounds/songs'
      - 'sluchohry_sessions:/var/www/html/sessions'
      - 'sluchohry_log:/var/www/html/log'
    ports:
      - '80'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health.php | grep -q '\"status\":\"ok\"'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      sluchohry-db:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 128
    restart: unless-stopped
  sluchohry-db:
    image: 'mariadb:10.5'
    environment:
      MYSQL_DATABASE: sluchohry
      MYSQL_USER: sluchohry
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
    volumes:
      - 'sluchohry_db:/var/lib/mysql'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: 0.75
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 256
    restart: unless-stopped
volumes:
  sluchohry_songs: null
  sluchohry_sessions: null
  sluchohry_log: null
  sluchohry_db: null
