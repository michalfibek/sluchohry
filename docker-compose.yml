services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        PHP_VERSION: ${PHP_VERSION:-7.0}
    ports:
      - '8080:80'
    volumes:
      - .:/var/www/html
    environment:
      APP_DEBUG: '1'
    depends_on:
      - db
  db:
    image: 'mariadb:10.11'
    environment:
      MYSQL_DATABASE: sluchohry
      MYSQL_USER: sluchohry
      MYSQL_PASSWORD: sluchohry
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - '${DB_DUMP_FILE:-/dev/null}:/docker-entrypoint-initdb.d-dump/dump.sql.gz:ro'
volumes:
  db_data:
